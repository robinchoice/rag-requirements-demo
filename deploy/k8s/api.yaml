apiVersion: v1
kind: Service
metadata:
  name: mdr-api
spec:
  selector:
    app: mdr-api
  ports:
    - port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdr-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mdr-api
  template:
    metadata:
      labels:
        app: mdr-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api
          image: mdr-rag
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: mdr-api
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mdr-db
                  key: DATABASE_URL
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
